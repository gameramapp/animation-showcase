name: animation_showcase
description: A live catalog of Flutter animations for designers, hosted as a web app.
version: 1.0.0+1
publish_to: none

environment:
  sdk: ^3.9.0-0

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  animations: ^2.2.0
  flutter_animate: ^4.1.0
  go_router: ^16.0.0
  heroine: ^0.7.2
  flutter_bounceable: ^1.2.0
  animated_text_kit: ^4.3.0
  flutter_staggered_animations: ^1.1.1
  matrix4_transform: ^4.0.1
  lottie: ^3.3.3
  rive: ^0.14.11
  flutter_tilt: ^4.1.0
  custom_refresh_indicator: ^4.0.2
  wolt_modal_sheet: ^0.11.0
  like_button: ^2.1.0
  zo_animated_border: ^1.1.0
  shared_preferences: ^2.5.5

dev_dependencies:
  flutter_test:
    sdk: flutter

flutter:
  uses-material-design: true
  assets:
    - assets/
    - assets/lottie/
    - assets/rive/
  fonts:
    - family: SpecialElite
      fonts:
        - asset: fonts/SpecialElite-Regular.ttf
