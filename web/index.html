<!DOCTYPE html>
<html lang="en">
<head>
  <!--
    $FLUTTER_BASE_HREF is replaced by the `--base-href` argument of
    `flutter build web` (the GitHub Pages workflow passes "/<repo>/").
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <title>Flutter Animation Showcase</title>
  <meta name="description" content="A live catalog of Flutter animations for designers: browse effects, tweak duration, curves and strength, and copy the spec for the developers.">
  <meta name="theme-color" content="#673AB7">

  <!-- Link previews (Slack, Telegram, etc.) -->
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="Flutter Animation Showcase">
  <meta property="og:title" content="Flutter Animation Showcase">
  <meta property="og:description" content="A live catalog of Flutter animations for designers: tweak timing and curves, copy the spec.">
  <meta property="og:url" content="https://gameramapp.github.io/animation-showcase/">
  <meta property="og:image" content="https://gameramapp.github.io/animation-showcase/icons/og-image.png">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta name="twitter:card" content="summary_large_image">

  <!-- Icons -->
  <link rel="icon" type="image/svg+xml" href="favicon.svg">
  <link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="favicon.png">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">

  <!-- Installed as a web app -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Animations">
  <link rel="manifest" href="manifest.json">
</head>
<body>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
